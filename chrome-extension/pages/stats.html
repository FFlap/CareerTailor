<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="stats.css" />
    <title>Stats</title>
  </head>
  <body>
    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div style="padding: 0 12px; margin-bottom: 32px;">
          <div style="font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 10px;">
            <div style="width: 24px; height: 24px; background: var(--primary); border-radius: 6px;"></div>
            ResumeGen
          </div>
        </div>

        <nav class="nav-menu">
          <a href="profile.html" class="nav-item">
            <span>Profile</span>
          </a>
          <a href="stats.html" class="nav-item active">
            <span>Stats</span>
          </a>
           <a href="settings.html" class="nav-item">
            <span>Settings</span>
          </a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <div class="header mb-4">
          <h1>Usage Stats</h1>
          <p>Gemini usage, rate limits, and token totals.</p>
        </div>

        <section class="card grid grid-2" id="summary"></section>

        <section class="card">
          <h2>Daily & Weekly Calls</h2>
          <div class="grid grid-2">
            <div>
              <h3>Daily</h3>
              <div id="dailyList" class="stat-list"></div>
            </div>
            <div>
              <h3>Weekly</h3>
              <div id="weeklyList" class="stat-list"></div>
            </div>
          </div>
        </section>

        <section class="card">
          <h2>Recent Errors</h2>
          <div id="errorsList" class="stat-list"></div>
        </section>
      </main>
    </div>
    <script type="module" src="stats.js"></script>
  </body>
</html>
