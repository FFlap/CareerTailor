<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="popup.css" />
    <title>AI Resume Builder</title>
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <div class="brand-name">CareerTailor</div>
          </div>
        </div>
        <button class="ghost settings-trigger" id="settingsBtn" type="button" aria-expanded="false">
          Settings
        </button>
      </header>

      <section class="card settings-panel is-hidden" id="settingsPanel">
        <div class="toolbar settings-toolbar">
          <div>
            <div class="section-title">Extension settings</div>
            <p class="small">Manage connection and quota-based site blocking.</p>
          </div>
        </div>

        <div class="settings-list">
          <div class="settings-row">
            <span class="small">Connection</span>
            <span class="badge" id="authStatus">Not connected</span>
          </div>

          <button class="secondary settings-connect" id="connectBtn" type="button">Connect</button>

          <label class="toggle-row" for="blockerEnabled">
            <span>Enable website blocker until quota is met</span>
            <input id="blockerEnabled" type="checkbox" />
          </label>

          <div class="blocker-config is-hidden" id="blockerConfigFields">
            <label for="requiredAppliedCount">Required applied jobs</label>
            <input id="requiredAppliedCount" type="number" min="0" step="1" value="5" />

            <label for="blockedDomains">Blocked websites (one per line)</label>
            <textarea
              id="blockedDomains"
              placeholder="youtube.com&#10;reddit.com&#10;news.ycombinator.com"
            ></textarea>

            <p class="small settings-progress" id="quotaProgressText">Applied today: -- / --</p>
          </div>

          <button class="primary" id="saveSettingsBtn" type="button">Save settings</button>
          <span class="small status" id="settingsStatus" role="status"></span>
        </div>
      </section>

      <section class="card" id="jobCard">
        <div class="toolbar">
          <div>
            <div class="section-title">Job capture</div>
            <p class="small">Pull from the current tab or add details manually.</p>
          </div>
          <button class="ghost" id="refreshJob">Rescrape</button>
        </div>

        <div class="job-summary">
          <span class="badge" id="jobSource">No job detected</span>
          <div class="job-summary-details">
            <div class="job-summary-title is-empty" id="jobTitleDisplay">Add job title</div>
            <div class="job-summary-company is-empty" id="jobCompanyDisplay">Add company</div>
            <div class="job-summary-url small is-empty" id="jobUrlDisplay">Add job URL</div>
          </div>
        </div>

        <details class="manual-entry" id="manualEntry">
          <summary>
            <span>Manual entry</span>
            <span class="summary-hint small">Optional</span>
          </summary>
          <div class="manual-fields">
            <label for="jobUrl">Job URL</label>
            <input id="jobUrl" type="text" placeholder="https://job-posting.com/role" />
            <div class="grid grid-2">
              <div>
                <label for="jobTitle">Job Title</label>
                <input id="jobTitle" type="text" placeholder="Role title" />
              </div>
              <div>
                <label for="jobCompany">Company</label>
                <input id="jobCompany" type="text" placeholder="Company name" />
              </div>
            </div>
            <label for="jobDescription">Job Description</label>
            <textarea id="jobDescription" placeholder="Paste highlights if needed"></textarea>
          </div>
        </details>

        <div class="actions">
          <button class="secondary" id="syncBtn">Sync Job</button>
          <button class="primary" id="generateInAppBtn">Generate in Web App</button>
        </div>
        <span class="small status" id="statusText" role="status"></span>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
