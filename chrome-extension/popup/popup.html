<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="popup.css" />
    <title>AI Resume Builder</title>
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <div class="brand-name">CareerTailor</div>
          </div>
        </div>
      </header>

      <section class="card">
        <div class="toolbar">
          <div>
            <div class="section-title">Account</div>
            <p class="small">Connect to sync jobs and generate resumes.</p>
          </div>
          <div class="toolbar-actions">
            <button class="primary" id="connectBtn">Connect</button>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="toolbar">
          <div>
            <div class="section-title">Settings</div>
            <p class="small">Connection status</p>
          </div>
          <div class="toolbar-actions">
            <span class="badge" id="authStatus">Not connected</span>
          </div>
        </div>
      </section>

      <section class="card" id="jobCard">
        <div class="toolbar">
          <div>
            <div class="section-title">Job capture</div>
            <p class="small">Pull from the current tab or add details manually.</p>
          </div>
          <button class="ghost" id="refreshJob">Rescrape</button>
        </div>

        <div class="job-summary">
          <span class="badge" id="jobSource">No job detected</span>
          <div class="job-summary-details">
            <div class="job-summary-title is-empty" id="jobTitleDisplay">Add job title</div>
            <div class="job-summary-company is-empty" id="jobCompanyDisplay">Add company</div>
            <div class="job-summary-url small is-empty" id="jobUrlDisplay">Add job URL</div>
          </div>
        </div>

        <details class="manual-entry" id="manualEntry">
          <summary>
            <span>Manual entry</span>
            <span class="summary-hint small">Optional</span>
          </summary>
          <div class="manual-fields">
            <label for="jobUrl">Job URL</label>
            <input id="jobUrl" type="text" placeholder="https://job-posting.com/role" />
            <div class="grid grid-2">
              <div>
                <label for="jobTitle">Job Title</label>
                <input id="jobTitle" type="text" placeholder="Role title" />
              </div>
              <div>
                <label for="jobCompany">Company</label>
                <input id="jobCompany" type="text" placeholder="Company name" />
              </div>
            </div>
            <label for="jobDescription">Job Description</label>
            <textarea id="jobDescription" placeholder="Paste highlights if needed"></textarea>
          </div>
        </details>

        <div class="actions">
          <button class="secondary" id="syncBtn">Sync Job</button>
          <button class="primary" id="generateInAppBtn">Generate in Web App</button>
        </div>
        <span class="small status" id="statusText" role="status"></span>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
