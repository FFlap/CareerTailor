<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="popup.css" />
    <title>AI Resume Builder</title>
  </head>
  <body>
    <main style="padding: 16px; margin: 0;">
      <div class="header mb-4" style="flex-direction: column; gap: 4px;">
        <div class="flex justify-between items-center" style="width: 100%;">
          <div style="font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px;">
             <div style="width: 20px; height: 20px; background: var(--primary); border-radius: 4px;"></div>
             CareerTailor
          </div>
          <div class="nav-links">
             <a href="#" id="openWebApp" target="_blank" rel="noreferrer noopener" style="font-size: 12px; color: var(--primary);">Open Web App ↗</a>
          </div>
        </div>
        <p class="text-small" style="margin: 0;">Scrape a job • Generate in the web app</p>
      </div>

      <section class="card">
        <div class="toolbar">
          <span class="badge" id="authStatus">Not connected</span>
          <button class="primary" id="connectBtn">Connect</button>
        </div>
        <p class="small" style="margin: 0;">
          The extension only scrapes job info and syncs it to your account.
        </p>
      </section>

      <section class="card" id="jobCard">
        <div class="toolbar">
          <span class="badge" id="jobSource">No job detected</span>
          <button class="ghost" id="refreshJob">Refresh</button>
        </div>
        <div class="grid grid-2">
          <div>
            <label for="jobTitle">Job Title</label>
            <input id="jobTitle" type="text" placeholder="Add job title" />
          </div>
          <div>
            <label for="jobCompany">Company</label>
            <input id="jobCompany" type="text" placeholder="Add company" />
          </div>
        </div>
        <label for="jobUrl">Job URL</label>
        <input id="jobUrl" type="text" placeholder="https://..." />
        <label for="jobDescription">Job Description</label>
        <textarea id="jobDescription" placeholder="Paste job description if auto-scrape fails"></textarea>
        <div class="toolbar">
          <button class="secondary" id="syncBtn">Sync Job</button>
          <button class="primary" id="generateInAppBtn">Generate in Web App</button>
        </div>
        <span class="small" id="statusText"></span>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
